name: CI build and tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: write
  security-events: write

jobs:
  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --redact --exit-code 1
          
  build:
    needs: secret-scan
    runs-on: ubuntu-latest
    
    container:
      image: maven:3.9.11-eclipse-temurin-21-noble

    steps:
      - name: Start CI
        run: echo "Start"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Clean, test and package  with maven
        run: |-
          if [ -x "./mvnw" ]; then
            ./mvnw -B clean test package
          else
            mvn -B clean test package
          fi

      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: code-report
          path: ./target/*.jar

      - name: End CI
        run: echo "End"

  dast-baseline:
    name: dast base scan 
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 
      
      - name: Download jar artifact
        uses: actions/download-artifact@v4
        with:
          name: code-report 
          path: target
    
      - name: jdk 21 
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      
      - name: zap permissions
        run: chmod -R a+w .
    
      - name: empty zap rule sarif file 
        run: touch zap-rules.tsv 
      
      - name: run application on bg
        run: |-
          java -jar target/*.jar &
          sleep 30
      
      - name: run zap base scan 
        uses: zaproxy/action-baseline@v0.9.0
        continue-on-error: true
        with:
          target: 'http://127.0.0.1:8080'
          rules_file_name: 'zap-rules.tsv'
          cmd_options: '-a -I -r zap-baseline-report.html'
          allow_issue_writing: false
          artifact_name: 'zap-baseline-artifact'
          token: ${{github.token}}
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'

      - name: upload zap base report 
        if: always()
        uses: actions/upload-artifact@v4 
        with:
          name: zap-baseline-report 
          path: zap-baseline-report.html
  dast-api:
    name: dast api scan 
    needs: build 
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 
      
      - name: Download jar artifact
        uses: actions/download-artifact@v4
        with:
          name: code-report 
          path: target
      
      - name: jdk 21 
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: zap permissions
        run: chmod -R a+w .
    
      - name: empty zap rule sarif file 
        run: touch zap-rules.tsv 
      
      - name: run application on bg
        run: |-
          java -jar target/*.jar &
          sleep 30
      
      - name: run zap api scan 
        uses: zaproxy/action-api-scan@v0.10.0
        continue-on-error: true
        with:
          target: 'http://127.0.0.1:8080/v3/api-docs'
          format: openapi
          rules_file_name: 'zap-rules.tsv'
          cmd_options: '-I -r zap-api-report.html'
          allow_issue_writing: false
          artifact_name: 'zap-api-artifact'
          token: ${{github.token}}
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'

      - name: upload zap api report 
        if: always()
        uses: actions/upload-artifact@v4 
        with:
          name: zap-api-report 
          path: zap-api-report.html  

